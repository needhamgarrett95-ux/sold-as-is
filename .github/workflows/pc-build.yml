name: PC test build

# Every push to the pc-desktop branch rebuilds the Windows game installer
# and the launcher on a real Windows runner, then refreshes the
# pc-test-v1 prerelease. Patch notes accumulate from commit messages.
on:
  push:
    branches: [pc-desktop]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pc-desktop
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build game installer
        run: |
          Copy-Item -Recurse -Force public pc\public
          cd pc
          npm ci
          npx electron-builder --win nsis

      - name: Build launcher
        run: |
          cd pc-launcher
          npm ci
          npx electron-builder --win portable

      - name: Refresh prerelease assets
        run: |
          gh release upload pc-test-v1 pc\dist\SoldAsIs-PC-test-setup.exe --clobber
          gh release upload pc-test-v1 pc-launcher\dist\SoldAsIs-Launcher.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync patch notes
        run: gh release edit pc-test-v1 --notes-file ..\PATCH_NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
