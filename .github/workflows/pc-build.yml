name: PC test build

# Every push to the pc-desktop branch rebuilds the Windows test build
# on a real Windows runner and refreshes the pc-test-v1 prerelease.
on:
  push:
    branches: [pc-desktop]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pc-desktop

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync game files into wrapper
        run: Copy-Item -Recurse -Force ..\public public

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npx electron-builder --win nsis

      - name: Refresh prerelease asset
        run: gh release upload pc-test-v1 dist/SoldAsIs-PC-test-setup.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
