<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sold As-Is</title>
<link rel="stylesheet" href="css/style-v6.css">
</head>
<body>
<div id="browser">
  <div id="chrome">
    <div class="traffic">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    </div>
    <div class="tab"><span class="tab-icon">🏍</span> MotoMarket — Mopeds for sale</div>
    <div class="urlbar">
      <span class="lock">🔒</span><span class="url">motomarket.place/mopeds</span><span class="reload">↻</span>
    </div>
  </div>
  <div id="site">
    <header id="site-header">
      <div class="logo">moto<span>market</span></div>
      <div class="search"><input type="text" placeholder="Search mopeds, parts, brands..." disabled></div>
      <button class="refresh-btn" id="refresh-btn" title="Refresh listings">↻</button>
      <div class="wallet" id="cash">$1,500</div>
    </header>
    <nav id="cats">
      <a class="active">All mopeds</a><a>Under $500</a><a>Runs & drives</a><a>Projects</a><a>Parts</a>
    </nav>
    <nav id="mainnav">
      <button class="mnav active" data-view="market">Market</button>
      <button class="mnav" data-view="garage">Garage <span id="nav-garage-n"></span></button>
      <button class="mnav" data-view="collection">Collection</button>
    </nav>
    <div id="feed"></div>
    <div id="detail" class="hidden"></div>
    <div id="garage-view" class="pane hidden"></div>
    <div id="collection-view" class="pane hidden"></div>
    <footer id="site-footer">MotoMarket © 2026 · Sold as-is. No warranties, no take-backs. · <a>Terms</a> · <a>Privacy</a></footer>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/feed.js"></script>
<script src="js/detail.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
