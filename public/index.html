<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sold As-Is</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">SOLD <span>AS-IS</span></div>
    <div class="cash" id="cash">$1,500</div>
  </header>
  <div id="feed"></div>
  <div id="detail" class="hidden"></div>
  <nav id="tabbar">
    <button class="tab active" data-tab="feed">Market</button>
    <button class="tab" data-tab="garage">Garage <span id="garage-count"></span></button>
    <button class="tab" data-tab="collection">Collection</button>
  </nav>
</div>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/feed.js"></script>
<script src="js/detail.js"></script>
<script src="js/app.js"></script>
</body>
</html>
