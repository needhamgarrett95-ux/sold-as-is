<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sold As-Is</title>
<link rel="icon" type="image/png" href="app-icon.png">
<link rel="apple-touch-icon" href="app-icon.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<!-- Login / splash screen -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-avatar"></div>
    <div class="login-brand">sold <span>as-is</span></div>
    <div class="login-sub">Sign in to continue</div>
    <div class="field">
      <label>Username</label>
      <input id="username" type="text" value="flippin_scootz" autocomplete="off" spellcheck="false">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="password" type="password" placeholder="•••••••" autocomplete="off">
    </div>
    <button id="login-btn">Log In</button>
    <div class="login-foot">Sold as-is. <b>No warranties, no take-backs.</b></div>
  </div>
</div>
<div id="browser">
  <div id="chrome">
    <div class="traffic">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    </div>
    <div id="tabstrip">
      <button class="wtab active" data-view="market"><span class="tab-icon">🏍</span> Sold As-Is</button>
      <button class="wtab" data-view="parts"><span class="tab-icon">⚙️</span> Boneyard</button>
      <button class="wtab" data-view="garage"><span class="tab-icon">🔧</span> Garage</button>
      <button class="wtab" data-view="collection"><span class="tab-icon">🏆</span> Collection</button>
    </div>
    <div class="urlbar">
      <span class="lock">🔒</span><span class="url">soldasis.place/mopeds</span>
      <button class="url-refresh" id="refresh-btn" title="Refresh listings">↻</button>
      <div class="url-wallet" id="cash">$1,500</div>
    </div>
  </div>
  <div id="site">
    <header id="site-header">
      <div class="logo">sold <span>as-is</span></div>
      <div class="search"><input type="text" placeholder="Search mopeds, parts, brands..." disabled></div>
    </header>
    <nav id="cats">
      <a class="active" data-filter="all">All mopeds</a><a data-filter="under500">Under $500</a><a data-filter="runners">Runs & drives</a><a data-filter="projects">Projects</a>
    </nav>
    <div id="feed"></div>
    <div id="detail" class="hidden"></div>
    <div id="parts-view" class="pane hidden"></div>
    <div id="garage-view" class="pane hidden"></div>
    <div id="collection-view" class="pane hidden"></div>
    <footer id="site-footer">Sold As-Is © 2026 · Sold as-is. No warranties, no take-backs. · <a>Terms</a> · <a>Privacy</a></footer>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/parts_manifest.js"></script>
<script src="js/state.js"></script>
<script src="js/feed.js"></script>
<script src="js/detail.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
